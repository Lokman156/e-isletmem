<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteriler - FaturaPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #fff;
            border-right: 1px solid #e2e8f0;
            padding: 24px 16px;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        .sidebar-logo {
            display: flex; align-items: center; gap: 10px;
            padding: 0 8px; margin-bottom: 32px;
        }
        .sidebar-logo .s-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .sidebar-logo h2 { font-size: 18px; font-weight: 800; }
        .sidebar-logo span { color: #10b981; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 14px; border-radius: 10px;
            color: #64748b; text-decoration: none;
            font-weight: 600; font-size: 13px;
            transition: all 0.2s;
        }
        .sidebar-nav a:hover { background: #f1f5f9; color: #0f172a; }
        .sidebar-nav a.active { background: #ecfdf5; color: #10b981; font-weight: 700; }
        .sidebar-footer { border-top: 1px solid #e2e8f0; padding-top: 14px; }
        .sidebar-footer button {
            width: 100%; padding: 11px;
            background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 10px; color: #ef4444;
            font-weight: 600; font-size: 13px; cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .main {
            flex: 1; margin-left: 250px;
            padding: 24px 28px;
        }
        .top-bar {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 24px;
            flex-wrap: wrap; gap: 12px;
        }
        .top-bar h1 { font-size: 24px; font-weight: 800; }
        .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-box {
            position: relative;
        }
        .search-box input {
            padding: 10px 14px 10px 38px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0f172a; outline: none;
            background: #fff; width: 220px;
            transition: all 0.2s;
        }
        .search-box input:focus { border-color: #3b82f6; }
        .search-box i {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            color: #94a3b8; font-size: 14px;
        }
        .btn-primary {
            padding: 10px 18px;
            background: #10b981; color: #fff;
            border: none; border-radius: 10px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #059669; }
        .musteri-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .musteri-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px;
            transition: all 0.2s;
        }
        .musteri-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); transform: translateY(-1px); }
        .musteri-card .m-avatar {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 16px;
            margin-bottom: 12px;
        }
        .musteri-card h4 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
        .musteri-card .info-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: #64748b; margin-bottom: 5px;
        }
        .musteri-card .info-row i { width: 14px; color: #94a3b8; }
        .musteri-card .card-actions {
            display: flex; gap: 8px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid #f1f5f9;
        }
        .musteri-card .card-actions button {
            flex: 1; padding: 8px 12px;
            border-radius: 8px; border: 1px solid #e2e8f0;
            background: #fff; color: #64748b;
            font-weight: 600; font-size: 11px; cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.2s;
        }
        .musteri-card .card-actions button:hover { background: #f1f5f9; }
        .musteri-card .card-actions button.del:hover { background: #fef2f2; color: #ef4444; border-color: #fecaca; }
        .empty { text-align: center; padding: 40px; color: #94a3b8; grid-column: 1/-1; }
        .empty i { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200; display: flex;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal {
            background: #fff; border-radius: 20px;
            padding: 28px; width: 100%; max-width: 460px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }
        .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; font-size: 11px; font-weight: 700;
            color: #64748b; margin-bottom: 4px;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px 14px;
            border: 1.5px solid #e2e8f0; border-radius: 8px;
            font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0f172a; outline: none; background: #f8fafc;
            transition: all 0.2s; resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #3b82f6; background: #fff;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.06);
        }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel {
            padding: 10px 20px; background: #f1f5f9;
            border: 1px solid #e2e8f0; border-radius: 8px;
            color: #64748b; font-weight: 600; cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-save {
            padding: 10px 20px; background: #3b82f6;
            border: none; border-radius: 8px;
            color: #fff; font-weight: 700; cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .menu-btn {
            display: none; position: fixed; top: 16px; left: 16px;
            z-index: 200; width: 40px; height: 40px;
            background: #fff; border: 1px solid #e2e8f0;
            border-radius: 10px; font-size: 18px; cursor: pointer; color: #0f172a;
        }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 99; }
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 14px 20px; border-radius: 12px;
            color: #fff; font-weight: 600; font-size: 13px;
            z-index: 999; display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .overlay.open { display: block; }
            .main { margin-left: 0; padding: 16px; }
            .menu-btn { display: flex; align-items: center; justify-content: center; }
            .musteri-grid { grid-template-columns: 1fr; }
            .search-box input { width: 160px; }
        }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="s-icon"><i class="fa-solid fa-file-invoice"></i></div>
            <h2>Fatura<span>Pro</span></h2>
        </div>
        <nav class="sidebar-nav">
    <a href="dashboard.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
    <a href="faturalar.html"><i class="fa-solid fa-receipt"></i> Faturalar</a>
    <a href="musteriler.html" class="active"><i class="fa-solid fa-users"></i> Müşteriler</a>
    <a href="urunler.html"><i class="fa-solid fa-box"></i> Ürünler</a>
    <a href="borc-alacak.html"><i class="fa-solid fa-scale-balanced"></i> Borç/Alacak</a>
    <a href="kasa-defteri.html"><i class="fa-solid fa-cash-register"></i> Kasa Defteri</a>
    <a href="tekrarlayan-fatura.html"><i class="fa-solid fa-rotate"></i> Tekrarlayan Fatura</a>
    <a href="ibanlar.html"><i class="fa-solid fa-building-columns"></i> IBANlar</a>
    <a href="gelir-gider.html"><i class="fa-solid fa-coins"></i> Gelir/Gider</a>
    <a href="para-hareketleri.html"><i class="fa-solid fa-arrow-right-arrow-left"></i> Para Hareketleri</a>
    <a href="calisanlar.html"><i class="fa-solid fa-user-tie"></i> Çalışanlar</a>
    <a href="yedekleme.html"><i class="fa-solid fa-download"></i> Yedekleme</a>
    <a href="kurlar.html"><i class="fa-solid fa-chart-line"></i> Canlı Kurlar</a>
    <a href="ayarlar.html"><i class="fa-solid fa-gear"></i> Ayarlar</a>
</nav>
        <div class="sidebar-footer">
            <button onclick="cikisYap()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</button>
        </div>
    </aside>

    <main class="main">
        <div class="top-bar">
            <h1>👥 Müşteriler</h1>
            <div class="top-actions">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Müşteri ara..." oninput="filterMusteriler()">
                </div>
                <button class="btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Yeni Müşteri</button>
            </div>
        </div>

        <div class="musteri-grid" id="musteriGrid">
            <div class="empty"><i class="fa-solid fa-users"></i><p>Henüz müşteri yok</p></div>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <h3 id="modalTitle">Yeni Müşteri</h3>
            <form id="musteriForm">
                <input type="hidden" id="musteriId">
                <div class="form-group">
                    <label>Ad Soyad / Firma Adı</label>
                    <input type="text" id="adSoyad" placeholder="Müşteri adı" required>
                </div>
                <div class="form-group">
                    <label>E-posta</label>
                    <input type="email" id="email" placeholder="ornek@email.com">
                </div>
                <div class="form-group">
                    <label>Telefon</label>
                    <input type="tel" id="telefon" placeholder="05XX XXX XX XX">
                </div>
                <div class="form-group">
                    <label>Adres</label>
                    <textarea id="adres" rows="2" placeholder="Adres bilgisi"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">İptal</button>
                    <button type="submit" class="btn-save">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2UDy6nNB966e_oiU46z1l_lgW4SChpFI",
            authDomain: "yonetim-f485e.firebaseapp.com",
            projectId: "yonetim-f485e",
            storageBucket: "yonetim-f485e.firebasestorage.app",
            messagingSenderId: "699827175577",
            appId: "1:699827175577:web:0806bd508a82e6cbeaf808",
            measurementId: "G-SMGKQBM22K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let tumMusteriler = [];

        window.toggleMenu = function() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
};

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `toast ${type}`;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 4000);
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            await loadMusteriler();
        });

        async function loadMusteriler() {
            const snap = await getDocs(query(collection(db, "musteriler"), where("isletmeId", "==", currentUser.uid)));
            tumMusteriler = [];
            snap.forEach(doc => tumMusteriler.push({ id: doc.id, ...doc.data() }));
            renderMusteriler(tumMusteriler);
        }

        function renderMusteriler(liste) {
            const grid = document.getElementById('musteriGrid');
            if (liste.length === 0) {
                grid.innerHTML = '<div class="empty"><i class="fa-solid fa-users"></i><p>Henüz müşteri yok</p></div>';
                return;
            }
            grid.innerHTML = liste.map(m => `
                <div class="musteri-card">
                    <div class="m-avatar">${(m.adSoyad||'M').charAt(0).toUpperCase()}</div>
                    <h4>${m.adSoyad||'-'}</h4>
                    ${m.email ? `<div class="info-row"><i class="fa-solid fa-envelope"></i>${m.email}</div>` : ''}
                    ${m.telefon ? `<div class="info-row"><i class="fa-solid fa-phone"></i>${m.telefon}</div>` : ''}
                    ${m.adres ? `<div class="info-row"><i class="fa-solid fa-location-dot"></i>${m.adres}</div>` : ''}
                    <div class="card-actions">
                        <button onclick="editMusteri('${m.id}')"><i class="fa-solid fa-pen"></i> Düzenle</button>
                        <button class="del" onclick="deleteMusteri('${m.id}')"><i class="fa-solid fa-trash"></i> Sil</button>
                    </div>
                </div>
            `).join('');
        }

        window.filterMusteriler = function() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            renderMusteriler(tumMusteriler.filter(m =>
                (m.adSoyad||'').toLowerCase().includes(s) ||
                (m.email||'').toLowerCase().includes(s) ||
                (m.telefon||'').toLowerCase().includes(s)
            ));
        };

        window.openModal = function(musteri = null) {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalTitle').textContent = musteri ? 'Müşteri Düzenle' : 'Yeni Müşteri';
            document.getElementById('musteriId').value = musteri?.id || '';
            document.getElementById('adSoyad').value = musteri?.adSoyad || '';
            document.getElementById('email').value = musteri?.email || '';
            document.getElementById('telefon').value = musteri?.telefon || '';
            document.getElementById('adres').value = musteri?.adres || '';
        };

        window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

        document.getElementById('musteriForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mid = document.getElementById('musteriId').value;
            const data = {
                adSoyad: document.getElementById('adSoyad').value.trim(),
                email: document.getElementById('email').value.trim(),
                telefon: document.getElementById('telefon').value.trim(),
                adres: document.getElementById('adres').value.trim(),
                isletmeId: currentUser.uid,
                updatedAt: serverTimestamp()
            };
            try {
                if (mid) {
                    await updateDoc(doc(db, "musteriler", mid), data);
                    showToast('Müşteri güncellendi', 'success');
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "musteriler"), data);
                    showToast('Müşteri eklendi', 'success');
                }
                closeModal();
                await loadMusteriler();
            } catch (err) { showToast('Hata: ' + err.message, 'error'); }
        });

        window.editMusteri = function(id) {
            const m = tumMusteriler.find(x => x.id === id);
            if (m) openModal(m);
        };

        window.deleteMusteri = async function(id) {
            if (!confirm('Bu müşteriyi silmek istediğinize emin misiniz?')) return;
            await deleteDoc(doc(db, "musteriler", id));
            showToast('Müşteri silindi', 'success');
            await loadMusteriler();
        };

        window.cikisYap = async () => { await signOut(auth); window.location.href = 'login.html'; };
    </script>
</body>
</html>
