<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Sterlin Kuru (GBP/TRY)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 360px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .flag {
            font-size: 26px;
        }
        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .price-container {
            margin: 20px 0;
        }
        .price {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            transition: color 0.3s ease;
        }
        .currency-symbol {
            font-size: 24px;
            color: #a855f7;
            font-weight: 700;
            margin-left: 4px;
        }
        .trend-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 24px;
            background: rgba(168, 85, 247, 0.1);
            color: #d8b4fe;
        }
        .footer-info {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .time {
            font-size: 13px;
            color: #94a3b8;
        }
        .status {
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #a855f7;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(168, 85, 247, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(168, 85, 247, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(168, 85, 247, 0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span class="flag">🇬🇧 ➡️ 🇹🇷</span>
            <h2>GBP / TRY Kuru</h2>
        </div>
        
        <div class="price-container">
            <div class="price" id="sterlinFiyati">--,-- <span class="currency-symbol">TL</span></div>
        </div>

        <div class="trend-indicator" id="trendBadge">
            <span>🟣 Canlı Veri Akışı</span>
        </div>

        <div class="footer-info">
            <div class="time" id="guncellemeZamani">Son Güncelleme: Bekleniyor...</div>
            <div class="status">
                <span class="pulse-dot"></span> Her 10 saniyede bir güncellenir
            </div>
        </div>
    </div>

    <script>
        let eskiFiyat = null;

        async function sterlinKuruGetir() {
            const fiyatDiv = document.getElementById('sterlinFiyati');
            const zamanDiv = document.getElementById('guncellemeZamani');
            
            try {
                // API'den GBP bazlı verileri çekiyoruz (GBP'nin TRY karşılığı için)
                const response = await fetch('https://open.er-api.com/v6/latest/GBP');
                const data = await response.json();

                if (data && data.rates && data.rates.TRY) {
                    const yeniFiyat = data.rates.TRY;
                    const formatliFiyat = yeniFiyat.toFixed(4);
                    
                    fiyatDiv.innerHTML = `${formatliFiyat} <span class="currency-symbol">TL</span>`;
                    
                    const simdi = new Date().toLocaleTimeString('tr-TR');
                    zamanDiv.innerText = `Son Güncelleme: ${simdi}`;

                    // Fiyat değişimine göre renk vurgusu (Yükseldiyse yeşil, düştüyse kırmızı)
                    if (eskiFiyat !== null) {
                        if (yeniFiyat > eskiFiyat) {
                            fiyatDiv.style.color = '#34d399'; // Yükseldi
                        } else if (yeniFiyat < eskiFiyat) {
                            fiyatDiv.style.color = '#f87171'; // Düştü
                        }
                    }
                    eskiFiyat = yeniFiyat;

                } else {
                    fiyatDiv.innerText = "Veri Alınamadı";
                }
            } catch (error) {
                console.error("Hata:", error);
                fiyatDiv.innerText = "Bağlantı Hatası";
            }
        }

        // İlk açılışta çalıştır
        sterlinKuruGetir();

        // 10 saniyede bir otomatik güncelle
        setInterval(sterlinKuruGetir, 10000);
    </script>

</body>
</html>
