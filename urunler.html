<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürünler - E-İşletmem</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #0f172a; display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: #fff; border-right: 1px solid #e2e8f0; padding: 20px 14px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; transition: transform 0.3s; }
        .sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 0 8px; margin-bottom: 28px; }
        .sidebar-logo .s-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; }
        .sidebar-logo h2 { font-size: 17px; font-weight: 800; }
        .sidebar-logo span { color: #10b981; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #64748b; text-decoration: none; font-weight: 600; font-size: 12px; transition: all 0.2s; }
        .sidebar-nav a:hover { background: #f1f5f9; color: #0f172a; }
        .sidebar-nav a.active { background: #f5f3ff; color: #7c3aed; font-weight: 700; }
        .sidebar-footer { border-top: 1px solid #e2e8f0; padding-top: 12px; }
        .sidebar-footer button { width: 100%; padding: 10px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; color: #ef4444; font-weight: 600; font-size: 12px; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; }
        .main { flex: 1; margin-left: 250px; padding: 20px 24px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .top-bar h1 { font-size: 22px; font-weight: 800; }
        .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .search-box { position: relative; }
        .search-box input { padding: 9px 12px 9px 34px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif; width: 200px; outline: none; background: #fff; }
        .search-box i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 13px; }
        .btn { padding: 9px 14px; border: none; border-radius: 7px; font-weight: 700; font-size: 11px; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .btn-primary { background: #7c3aed; color: #fff; }
        .btn-primary:hover { background: #6d28d9; }
        .btn-green { background: #10b981; color: #fff; }
        .btn-green:hover { background: #059669; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 10px 12px; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        tr:hover td { background: #f8fafc; }
        .stok-dusuk { color: #ef4444; font-weight: 700; }
        .stok-orta { color: #f59e0b; font-weight: 700; }
        .stok-yuksek { color: #10b981; font-weight: 700; }
        .action-btns { display: flex; gap: 4px; }
        .action-btns button { width: 28px; height: 28px; border-radius: 5px; border: 1px solid #e2e8f0; background: #fff; color: #64748b; cursor: pointer; font-size: 11px; transition: all 0.2s; }
        .action-btns button:hover { background: #f1f5f9; }
        .action-btns button.del:hover { background: #fef2f2; color: #ef4444; }
        .action-btns button.barkod:hover { background: #f5f3ff; color: #7c3aed; }
        .barkod-cell { font-size: 10px; color: #94a3b8; font-family: monospace; }
        .empty { text-align: center; padding: 30px; color: #94a3b8; }
        .empty i { font-size: 30px; margin-bottom: 8px; opacity: 0.5; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .modal { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; outline: none; background: #f8fafc; }
        .form-group input:focus, .form-group select:focus { border-color: #7c3aed; background: #fff; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        .btn-cancel { padding: 8px 16px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; color: #64748b; font-weight: 600; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; }
        .btn-save { padding: 8px 16px; background: #7c3aed; border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; }
        .barkod-preview { text-align: center; padding: 10px; }
        .barkod-preview img { max-width: 200px; }
        .menu-btn { display: none; position: fixed; top: 12px; left: 12px; z-index: 200; width: 38px; height: 38px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 16px; cursor: pointer; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 99; }
        .toast { position: fixed; top: 16px; right: 16px; padding: 12px 18px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 12px; z-index: 999; display: none; animation: slideIn 0.3s ease; }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .overlay.open { display: block; } .main { margin-left: 0; padding: 14px; } .menu-btn { display: flex; align-items: center; justify-content: center; } .search-box input { width: 130px; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="s-icon"><i class="fa-solid fa-shop"></i></div><h2>E-İşlet<span>mem</span></h2></div>
    <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
        <a href="faturalar.html"><i class="fa-solid fa-receipt"></i> Faturalar</a>
        <a href="musteriler.html"><i class="fa-solid fa-users"></i> Müşteriler</a>
        <a href="urunler.html" class="active"><i class="fa-solid fa-box"></i> Ürünler</a>
        <a href="iadeler.html"><i class="fa-solid fa-rotate-left"></i> İadeler</a>
        <a href="borc-alacak.html"><i class="fa-solid fa-scale-balanced"></i> Borç/Alacak</a>
        <a href="kasa-defteri.html"><i class="fa-solid fa-cash-register"></i> Kasa Defteri</a>
        <a href="tekrarlayan-fatura.html"><i class="fa-solid fa-rotate"></i> Tekrarlayan Fatura</a>
        <a href="ibanlar.html"><i class="fa-solid fa-building-columns"></i> IBANlar</a>
        <a href="gelir-gider.html"><i class="fa-solid fa-coins"></i> Gelir/Gider</a>
        <a href="para-hareketleri.html"><i class="fa-solid fa-arrow-right-arrow-left"></i> Para Hareketleri</a>
        <a href="calisanlar.html"><i class="fa-solid fa-user-tie"></i> Çalışanlar</a>
        <a href="yedekleme.html"><i class="fa-solid fa-download"></i> Yedekleme</a>
        <a href="kurlar.html"><i class="fa-solid fa-chart-line"></i> Canlı Kurlar</a>
        <a href="ayarlar.html"><i class="fa-solid fa-gear"></i> Ayarlar</a>
    </nav>
    <div class="sidebar-footer"><button onclick="cikisYap()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</button></div>
</aside>

<main class="main">
    <div class="top-bar">
        <h1>📦 Ürünler / Hizmetler</h1>
        <div class="top-actions">
            <div class="search-box"><i class="fa-solid fa-search"></i><input type="text" id="searchInput" placeholder="Ürün ara..." oninput="filterUrunler()"></div>
            <div class="search-box"><i class="fa-solid fa-barcode"></i><input type="text" id="barkodSearch" placeholder="Barkod ara..." oninput="barkodAra()"></div>
            <button class="btn btn-green" onclick="openModal()"><i class="fa-solid fa-plus"></i> Yeni Ürün</button>
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Ürün Adı</th><th>Barkod</th><th>Birim Fiyat</th><th>KDV</th><th>Stok</th><th>Açıklama</th><th>İşlem</th></tr></thead>
                <tbody id="urunTableBody">
                    <tr><td colspan="7"><div class="empty"><i class="fa-solid fa-box"></i><p>Henüz ürün yok</p></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
        <h3 id="modalTitle">Yeni Ürün</h3>
        <form id="urunForm">
            <input type="hidden" id="urunId">
            <div class="form-group"><label>Ürün / Hizmet Adı</label><input type="text" id="urunAdi" placeholder="Ürün adı" required></div>
            <div class="form-group"><label>Barkod No</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="barkodNo" placeholder="Barkod numarası" style="flex:1;">
                    <button type="button" class="btn btn-primary" onclick="barkodUret()" style="white-space:nowrap;"><i class="fa-solid fa-barcode"></i> Üret</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Birim Fiyat (₺)</label><input type="number" id="birimFiyat" placeholder="0.00" min="0" step="0.01" required></div>
                <div class="form-group"><label>KDV Oranı (%)</label><select id="kdvOrani"><option value="0">%0</option><option value="1">%1</option><option value="10">%10</option><option value="20" selected>%20</option></select></div>
            </div>
            <div class="form-group"><label>Stok Adedi</label><input type="number" id="stok" placeholder="0" min="0" value="0"></div>
            <div class="form-group"><label>Açıklama</label><textarea id="aciklama" rows="2" placeholder="Opsiyonel açıklama"></textarea></div>
            <div class="barkod-preview" id="barkodPreview" style="display:none;"></div>
            <div class="modal-actions"><button type="button" class="btn-cancel" onclick="closeModal()">İptal</button><button type="submit" class="btn-save">Kaydet</button></div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyB2UDy6nNB966e_oiU46z1l_lgW4SChpFI", authDomain: "yonetim-f485e.firebaseapp.com", projectId: "yonetim-f485e", storageBucket: "yonetim-f485e.firebasestorage.app", messagingSenderId: "699827175577", appId: "1:699827175577:web:0806bd508a82e6cbeaf808" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
let tumUrunler = [];

window.toggleMenu = function() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); };
function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = `toast ${type}`; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 4000); }

onAuthStateChanged(auth, async (user) => { if (!user) { window.location.href = 'login.html'; return; } currentUser = user; await loadUrunler(); });

async function loadUrunler() { const snap = await getDocs(query(collection(db, "urunler"), where("isletmeId", "==", currentUser.uid))); tumUrunler = []; snap.forEach(doc => tumUrunler.push({ id: doc.id, ...doc.data() })); renderUrunler(tumUrunler); }

function getStokClass(stok) { if (stok <= 0) return 'stok-dusuk'; if (stok <= 10) return 'stok-orta'; return 'stok-yuksek'; }

function renderUrunler(liste) {
    const tbody = document.getElementById('urunTableBody');
    if (liste.length === 0) { tbody.innerHTML = '<tr><td colspan="7"><div class="empty"><i class="fa-solid fa-box"></i><p>Henüz ürün yok</p></div></td></tr>'; return; }
    tbody.innerHTML = liste.map(u => {
        const sc = getStokClass(u.stok || 0);
        const st = (u.stok || 0) <= 0 ? 'Tükendi' : u.stok;
        return `<tr>
            <td><strong>${u.urunAdi||'-'}</strong></td>
            <td class="barkod-cell">${u.barkodNo||'-'}</td>
            <td>₺${(u.birimFiyat||0).toLocaleString('tr-TR',{minimumFractionDigits:2})}</td>
            <td>%${u.kdvOrani||0}</td>
            <td><span class="${sc}">${st}</span></td>
            <td style="color:#94a3b8;">${u.aciklama||'-'}</td>
            <td>
                <div class="action-btns">
                    <button onclick="editUrun('${u.id}')"><i class="fa-solid fa-pen"></i></button>
                    ${u.barkodNo ? `<button class="barkod" onclick="barkodGoster('${u.barkodNo}')" title="Barkod Gör"><i class="fa-solid fa-barcode"></i></button>` : ''}
                    <button class="del" onclick="deleteUrun('${u.id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
            </td>
        </tr>`;
    }).join('');
}

window.filterUrunler = function() { const s = document.getElementById('searchInput').value.toLowerCase(); renderUrunler(tumUrunler.filter(u => (u.urunAdi||'').toLowerCase().includes(s) || (u.aciklama||'').toLowerCase().includes(s))); };

window.barkodAra = function() {
    const s = document.getElementById('barkodSearch').value.trim();
    if (!s) { renderUrunler(tumUrunler); return; }
    renderUrunler(tumUrunler.filter(u => (u.barkodNo||'').includes(s)));
};

window.barkodUret = function() {
    const no = '86' + Date.now().toString().slice(-10) + Math.floor(Math.random() * 100).toString().padStart(2,'0');
    document.getElementById('barkodNo').value = no;
    barkodGoster(no);
};

window.barkodGoster = function(no) {
    const preview = document.getElementById('barkodPreview');
    preview.style.display = 'block';
    preview.innerHTML = `<img src="https://barcode.tec-it.com/barcode.ashx?data=${no}&code=Code128&translate-esc=true&dpi=96&imagetype=png" alt="Barkod" style="max-width:100%;height:60px;"><br><span style="font-size:10px;color:#64748b;">${no}</span>`;
};

window.openModal = function(urun = null) {
    document.getElementById('modalOverlay').style.display = 'flex';
    document.getElementById('modalTitle').textContent = urun ? 'Ürün Düzenle' : 'Yeni Ürün';
    document.getElementById('urunId').value = urun?.id || '';
    document.getElementById('urunAdi').value = urun?.urunAdi || '';
    document.getElementById('barkodNo').value = urun?.barkodNo || '';
    document.getElementById('birimFiyat').value = urun?.birimFiyat || 0;
    document.getElementById('kdvOrani').value = urun?.kdvOrani || 20;
    document.getElementById('stok').value = urun?.stok || 0;
    document.getElementById('aciklama').value = urun?.aciklama || '';
    document.getElementById('barkodPreview').style.display = 'none';
    if (urun?.barkodNo) barkodGoster(urun.barkodNo);
};

window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

document.getElementById('urunForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const uid = document.getElementById('urunId').value;
    const data = {
        urunAdi: document.getElementById('urunAdi').value.trim(),
        barkodNo: document.getElementById('barkodNo').value.trim(),
        birimFiyat: parseFloat(document.getElementById('birimFiyat').value) || 0,
        kdvOrani: parseFloat(document.getElementById('kdvOrani').value) || 0,
        stok: parseInt(document.getElementById('stok').value) || 0,
        aciklama: document.getElementById('aciklama').value.trim(),
        isletmeId: currentUser.uid, updatedAt: serverTimestamp()
    };
    try {
        if (uid) { await updateDoc(doc(db, "urunler", uid), data); showToast('Güncellendi', 'success'); }
        else { data.createdAt = serverTimestamp(); await addDoc(collection(db, "urunler"), data); showToast('Eklendi', 'success'); }
        closeModal(); await loadUrunler();
    } catch (err) { showToast('Hata: ' + err.message, 'error'); }
});

window.editUrun = function(id) { const u = tumUrunler.find(x => x.id === id); if (u) openModal(u); };
window.deleteUrun = async function(id) { if (!confirm('Silinsin mi?')) return; await deleteDoc(doc(db, "urunler", id)); showToast('Silindi', 'success'); await loadUrunler(); };
window.cikisYap = async () => { await signOut(auth); window.location.href = 'login.html'; };
</script>
</body>
</html>
